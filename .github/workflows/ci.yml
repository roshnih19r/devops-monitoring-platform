name: DevOps Control Center CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
    contents: read
    packages: write

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m compileall -q app

      - name: Test Flask routes
        run: |
          python - <<'PY'
          from app.app import app

          client = app.test_client()

          assert client.get("/").status_code == 200
          assert client.get("/health").get_json()["status"] == "healthy"
          assert client.get("/api/deployments").status_code == 200

          print("All Flask tests passed!")
          PY
      - name: Build Docker image
        run: docker build -t devops-control-center .
  publish:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/roshnih19r/devops-monitoring-platform:latest
            ghcr.io/roshnih19r/devops-monitoring-platform:${{ github.sha }}